version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Persist database file
      - ./data:/usr/src/gik_backend/data
      - ./gik.db:/usr/src/gik_backend/gik.db
    environment:
      - DATABASE_URL=/usr/src/gik_backend/gik.db
      - RUST_LOG=actix_web=info
    restart: unless-stopped
    container_name: gik_backend

  # Optional: Frontend-only service for development
  # frontend:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./static:/usr/share/nginx/html
  #   depends_on:
  #     - backend
