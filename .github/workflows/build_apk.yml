name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Make gradlew executable
        run: chmod +x gradle/wrapper/gradle-wrapper.jar

      - name: Create gradlew script
        run: |
          cat > gradlew << 'EOF'
          #!/bin/sh
          
          # Resolve the real path of the wrapper script
          WRAPPER_SCRIPT="$(cd "$(dirname "$0")" && pwd)/gradle/wrapper/gradle-wrapper.jar"
          
          # Use Java to run the wrapper
          exec "$JAVA_HOME/bin/java" -Dorg.gradle.appname=gradlew -classpath "$WRAPPER_SCRIPT" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
