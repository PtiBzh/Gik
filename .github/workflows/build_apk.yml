name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # déclenchable à la main depuis l'onglet Actions

env:
  ANDROID_HOME: /usr/local/lib/android/sdk   # SDK préinstallé du runner

# Les runs en attente se remplacent : seul le dernier push est compilé.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      # JDK 17 requis par AGP 8.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installe Gradle 8.7 (le projet n'a pas de wrapper committé)
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # APK RELEASE SIGNÉ — uniquement si les secrets du keystore sont définis.
      # Sinon (premier build avant création du keystore), on saute proprement.
      - name: Build release APK (si keystore configuré)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $HOME/release.keystore
          export KEYSTORE_FILE=$HOME/release.keystore
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        with:
          name: apk-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
