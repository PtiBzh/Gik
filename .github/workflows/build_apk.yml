name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Install Gradle 6.8
        run: |
          wget https://services.gradle.org/distributions/gradle-6.8-bin.zip -P /tmp
          unzip -d /opt /tmp/gradle-6.8-bin.zip
          echo "GRADLE_HOME=/opt/gradle-6.8" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Pandroid.injected.invoked.from.ide=false
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
